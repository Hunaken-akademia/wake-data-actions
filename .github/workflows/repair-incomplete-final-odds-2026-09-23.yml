name: Repair incomplete WAKE final odds 2026-09-23

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-incomplete-final-odds-2026-09-23.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CAPTURE_TOKEN: ${{ secrets.CAPTURE_TOKEN }}
      PUBLIC_APP_URL: https://newhunaken456.vercel.app
      APP_BASE_URL: https://newhunaken456.vercel.app
      ODDS_CONCURRENCY: "4"
      EXHIBITION_CONCURRENCY: "4"
      WAKE_HEALTH_REQUIRE_AI: "0"
      WAKE_HEALTH_REPAIR: "1"
      WAKE_HEALTH_WRITE_DB: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Re-fetch incomplete final odds
        run: node pipeline/backfill_race_odds.mjs 2026-09-23
      - name: Verify repaired date
        env:
          WAKE_HEALTH_DATE: "2026-09-23"
        run: node pipeline/check_data_completeness.mjs
