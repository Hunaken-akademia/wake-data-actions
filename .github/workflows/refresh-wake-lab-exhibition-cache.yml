name: Refresh WAKE LAB exhibition cache

on:
  schedule:
    - cron: "20 23 * * *" # JST 08:20
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-wake-lab-exhibition-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh cached exhibition profiles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/refresh-wake-lab-exhibition-cache.mjs
