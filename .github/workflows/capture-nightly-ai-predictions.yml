name: capture-nightly-ai-predictions

on:
  workflow_dispatch:
concurrency:
  group: capture-nightly-ai-predictions
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Save every AI prediction with manually verified wind
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CAPTURE_TOKEN: ${{ secrets.CAPTURE_TOKEN }}
          AUTOMATION_AUTH_SESSION_JSON: ${{ secrets.AUTOMATION_AUTH_SESSION_JSON }}
          AI_CAPTURE_CONCURRENCY: "2"
        run: node pipeline/capture_nightly_ai_predictions.mjs
