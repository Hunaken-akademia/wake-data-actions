name: capture-all-active-races

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-all-active-races
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture active race data
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CAPTURE_TOKEN: ${{ secrets.CAPTURE_TOKEN }}
          CAPTURE_CONCURRENCY: "5"
          AI_SAVE_BEFORE_MINUTES: "30"
          RUNNER_NAME: "github-actions-public-fallback"
          RUN_ID: "github-${{ github.run_id }}-${{ github.run_attempt }}"
        run: node pipeline/capture_all_active_races.mjs
