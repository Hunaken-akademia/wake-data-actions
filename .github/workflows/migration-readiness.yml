name: migration-readiness

on:
  push:
    paths:
      - ".github/workflows/migration-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CAPTURE_TOKEN: ${{ secrets.CAPTURE_TOKEN }}
      WAKE_APP_URL: https://newhunaken456.vercel.app
    steps:
      - name: Verify required secrets are configured
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_KEY CAPTURE_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            else
              echo "$name: configured"
            fi
          done
          exit "$missing"

      - name: Verify Supabase credentials
        shell: bash
        run: |
          if [[ "$SUPABASE_URL" != https://*.supabase.co ]]; then
            echo "::error::SUPABASE_URL must be the full https://<project-ref>.supabase.co URL"
            exit 1
          fi
          code="$(curl -sS -o /tmp/supabase.json -w "%{http_code}"             "$SUPABASE_URL/rest/v1/races?select=race_date&limit=1"             -H "apikey: $SUPABASE_SERVICE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase credential check failed (HTTP $code)"
            exit 1
          fi
          echo "Supabase authentication: OK"

      - name: Verify CAPTURE_TOKEN against WAKE production
        if: always()
        shell: bash
        run: |
          date="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          code="$(curl -sS -o /tmp/wake.json -w "%{http_code}"             "$WAKE_APP_URL/api/yoso?action=ai_prediction_day&date=$date"             -H "x-capture-token: $CAPTURE_TOKEN")"
          if [ "$code" != "200" ]; then
            echo "::error::WAKE CAPTURE_TOKEN check failed (HTTP $code)"
            exit 1
          fi
          if ! grep -q '"ok":true' /tmp/wake.json; then
            echo "::error::WAKE CAPTURE_TOKEN check returned an unexpected response"
            exit 1
          fi
          echo "WAKE CAPTURE_TOKEN authentication: OK"
