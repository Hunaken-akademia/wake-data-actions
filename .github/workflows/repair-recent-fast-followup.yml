name: Repair WAKE recent gaps fast follow-up

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-recent-fast-followup.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-wake-recent-fast-followup
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CAPTURE_TOKEN: ${{ secrets.CAPTURE_TOKEN }}
      PUBLIC_APP_URL: https://newhunaken456.vercel.app
      APP_BASE_URL: https://newhunaken456.vercel.app
      PAYOUT_CONCURRENCY: "3"
      ODDS_CONCURRENCY: "4"
      EXHIBITION_CONCURRENCY: "4"
      WAKE_HEALTH_REQUIRE_AI: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fill missing payouts
        run: |
          for target_date in 2026-09-21 2026-09-22 2026-09-23 2026-09-24 2026-09-25 2026-09-26; do
            node pipeline/backfill_race_payouts.mjs "$target_date"
          done

      - name: Fill missing final odds
        run: node pipeline/backfill_race_odds.mjs 2026-09-21 2026-09-26

      - name: Fill missing exhibition
        run: node pipeline/backfill_race_exhibition.mjs 2026-09-21 2026-09-26

      - name: Final audit with targeted repair
        env:
          WAKE_HEALTH_REPAIR: "1"
          WAKE_HEALTH_WRITE_DB: "1"
        run: |
          for target_date in 2026-09-21 2026-09-22 2026-09-23 2026-09-24 2026-09-25 2026-09-26; do
            WAKE_HEALTH_DATE="$target_date" node pipeline/check_data_completeness.mjs
          done
