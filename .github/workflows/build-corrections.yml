name: build-corrections

on:
  schedule:
    - cron: "0 23 * * *" # JST 08:00
  workflow_dispatch:
    inputs:
      days:
        description: "補正に使う日数"
        required: true
        default: "180"
      wind_k:
        description: "風補正の縮小推定K"
        required: true
        default: "20"

permissions:
  contents: read

concurrency:
  group: build-corrections
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh server-side correction tables
        working-directory: pipeline
        run: |
          DAYS="${{ github.event.inputs.days || '180' }}"
          WIND_K="${{ github.event.inputs.wind_k || '20' }}"
          node build_corrections.mjs "$DAYS" "$WIND_K"
