name: Finalize WAKE recent health audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-recent-health-2026-09-21-26.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-wake-recent-fast-followup
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CAPTURE_TOKEN: ${{ secrets.CAPTURE_TOKEN }}
      PUBLIC_APP_URL: https://newhunaken456.vercel.app
      APP_BASE_URL: https://newhunaken456.vercel.app
      WAKE_HEALTH_REQUIRE_AI: "0"
      WAKE_HEALTH_REPAIR: "1"
      WAKE_HEALTH_WRITE_DB: "1"
      EXHIBITION_CONCURRENCY: "4"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit repaired dates and retry remaining recoverable gaps
        run: |
          for target_date in 2026-09-21 2026-09-22 2026-09-23 2026-09-24 2026-09-25 2026-09-26; do
            WAKE_HEALTH_DATE="$target_date" node pipeline/check_data_completeness.mjs
          done
